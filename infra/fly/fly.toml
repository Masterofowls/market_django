# Fly.io app config — set app name after `fly apps create`
app = "electromarket"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/ht/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
