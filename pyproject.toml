[project]
name = "market-django"
version = "0.1.0"
description = "Electronic store marketplace ecosystem (Django + DRF + Ninja + CMS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "django-ninja>=1.3",
    "django-allauth[mfa,socialaccount]>=65.0",
    "django-import-export>=4.0",
    "django-imagekit>=5.0",
    "django-health-check>=3.18",
    "django-cms>=4.1",
    "djangocms-text-ckeditor>=5.1",
    "djangocms-link>=4.0",
    "djangocms-picture>=4.0",
    "djangocms-file>=3.0",
    "djangocms-style>=3.0",
    "django-filer>=3.0",
    "easy-thumbnails>=2.8",
    "django-treebeard>=4.7",
    "django-sekizai>=4.1",
    "django-classy-tags>=4.1",
    "django-filter>=24.0",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["config", "apps", "packages", "tests"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
